<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Touch Pong</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    .game-wrapper {
      width: min(900px, 95vw);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 80px;
      margin-bottom: 12px;
      font-size: 2rem;
      font-weight: bold;
    }

    canvas {
      width: 100%;
      aspect-ratio: 2 / 1;
      display: block;
      background: #000;
      border: 3px solid white;
      cursor: none;
      touch-action: none;
    }

    p {
      color: #cbd5e1;
    }
  </style>
</head>

<body>
  <main class="game-wrapper">
    <h1>Pong</h1>

    <div class="scoreboard">
      <span>Player: <span id="playerScore">0</span></span>
      <span>Computer: <span id="computerScore">0</span></span>
    </div>

    <canvas id="gameCanvas" width="900" height="450"></canvas>

    <p>
      Drag your finger up and down on the game.
      You can also use the mouse or arrow keys.
    </p>
  </main>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const playerScoreElement = document.getElementById("playerScore");
    const computerScoreElement = document.getElementById("computerScore");

    const paddle = {
      width: 14,
      height: 90,
      speed: 7
    };

    const player = {
      x: 25,
      y: canvas.height / 2 - paddle.height / 2,
      score: 0
    };

    const computer = {
      x: canvas.width - 25 - paddle.width,
      y: canvas.height / 2 - paddle.height / 2,
      score: 0,
      speed: 4.5
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 9,
      speed: 6,
      velocityX: 6,
      velocityY: 3
    };

    const keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    document.addEventListener("keydown", (event) => {
      if (event.key in keys) {
        keys[event.key] = true;
        event.preventDefault();
      }
    });

    document.addEventListener("keyup", (event) => {
      if (event.key in keys) {
        keys[event.key] = false;
        event.preventDefault();
      }
    });

    function movePlayerToScreenY(screenY) {
      const rect = canvas.getBoundingClientRect();

      // Convert screen coordinates to the canvas's internal coordinates.
      const canvasY = (screenY - rect.top) * (canvas.height / rect.height);

      player.y = canvasY - paddle.height / 2;
      keepPaddleInsideField(player);
    }

    // Mouse controls.
    canvas.addEventListener("mousemove", (event) => {
      movePlayerToScreenY(event.clientY);
    });

    // Touch controls.
    canvas.addEventListener(
      "touchstart",
      (event) => {
        event.preventDefault();

        if (event.touches.length > 0) {
          movePlayerToScreenY(event.touches[0].clientY);
        }
      },
      { passive: false }
    );

    canvas.addEventListener(
      "touchmove",
      (event) => {
        event.preventDefault();

        if (event.touches.length > 0) {
          movePlayerToScreenY(event.touches[0].clientY);
        }
      },
      { passive: false }
    );

    function keepPaddleInsideField(currentPaddle) {
      currentPaddle.y = Math.max(
        0,
        Math.min(canvas.height - paddle.height, currentPaddle.y)
      );
    }

    function resetBall(direction) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      const angle = Math.random() * 0.8 - 0.4;

      ball.velocityX = direction * ball.speed;
      ball.velocityY = ball.speed * angle;
    }

    function rectanglesCollide(rect, circle) {
      const closestX = Math.max(
        rect.x,
        Math.min(circle.x, rect.x + rect.width)
      );

      const closestY = Math.max(
        rect.y,
        Math.min(circle.y, rect.y + rect.height)
      );

      const distanceX = circle.x - closestX;
      const distanceY = circle.y - closestY;

      return (
        distanceX * distanceX + distanceY * distanceY <
        circle.radius * circle.radius
      );
    }

    function update() {
      // Keyboard controls.
      if (keys.ArrowUp) {
        player.y -= paddle.speed;
      }

      if (keys.ArrowDown) {
        player.y += paddle.speed;
      }

      keepPaddleInsideField(player);

      // Computer follows the ball.
      const computerCenter = computer.y + paddle.height / 2;

      if (computerCenter < ball.y - 10) {
        computer.y += computer.speed;
      } else if (computerCenter > ball.y + 10) {
        computer.y -= computer.speed;
      }

      keepPaddleInsideField(computer);

      ball.x += ball.velocityX;
      ball.y += ball.velocityY;

      // Wall collision.
      if (
        ball.y - ball.radius <= 0 ||
        ball.y + ball.radius >= canvas.height
      ) {
        ball.velocityY *= -1;

        ball.y = Math.max(
          ball.radius,
          Math.min(canvas.height - ball.radius, ball.y)
        );
      }

      const playerRect = {
        x: player.x,
        y: player.y,
        width: paddle.width,
        height: paddle.height
      };

      const computerRect = {
        x: computer.x,
        y: computer.y,
        width: paddle.width,
        height: paddle.height
      };

      // Player paddle collision.
      if (
        ball.velocityX < 0 &&
        rectanglesCollide(playerRect, ball)
      ) {
        ball.x = player.x + paddle.width + ball.radius;
        ball.velocityX = Math.abs(ball.velocityX) + 0.25;

        const hitPosition =
          (ball.y - (player.y + paddle.height / 2)) /
          (paddle.height / 2);

        ball.velocityY = hitPosition * ball.speed;
      }

      // Computer paddle collision.
      if (
        ball.velocityX > 0 &&
        rectanglesCollide(computerRect, ball)
      ) {
        ball.x = computer.x - ball.radius;
        ball.velocityX = -Math.abs(ball.velocityX) - 0.25;

        const hitPosition =
          (ball.y - (computer.y + paddle.height / 2)) /
          (paddle.height / 2);

        ball.velocityY = hitPosition * ball.speed;
      }

      // Scoring.
      if (ball.x + ball.radius < 0) {
        computer.score++;
        computerScoreElement.textContent = computer.score;
        resetBall(1);
      }

      if (ball.x - ball.radius > canvas.width) {
        player.score++;
        playerScoreElement.textContent = player.score;
        resetBall(-1);
      }
    }

    function drawNet() {
      ctx.setLineDash([12, 14]);
      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 3;

      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();

      ctx.setLineDash([]);
    }

    function drawPaddle(currentPaddle) {
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(
        currentPaddle.x,
        currentPaddle.y,
        paddle.width,
        paddle.height
      );
    }

    function drawBall() {
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawNet();
      drawPaddle(player);
      drawPaddle(computer);
      drawBall();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
