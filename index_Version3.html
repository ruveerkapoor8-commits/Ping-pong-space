<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pong Game</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #111111;
      --paddle: #ffffff;
      --ball: #00bfff;
      --line: #444444;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-wrapper {
      width: min(900px, 95vw);
      text-align: center;
    }

    h1 {
      margin: 10px 0;
      font-size: 28px;
    }

    .scoreboard {
      display: flex;
      justify-content: center;
      gap: 80px;
      margin-bottom: 10px;
      font-size: 2rem;
      font-weight: bold;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 2 / 1;
      background: #000;
      border: 3px solid white;
      touch-action: none;
      user-select: none;
      cursor: none;
    }

    p {
      margin-top: 10px;
      color: #d1d5db;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <h1>Pong</h1>

    <div class="scoreboard">
      <span>Player: <span id="playerScore">0</span></span>
      <span>Computer: <span id="computerScore">0</span></span>
    </div>

    <canvas id="gameCanvas" width="900" height="450"></canvas>

    <p>Move with mouse, touch, or arrow keys.</p>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const playerScoreEl = document.getElementById("playerScore");
    const computerScoreEl = document.getElementById("computerScore");

    const paddleWidth = 14;
    const paddleHeight = 90;
    const paddleSpeed = 7;

    const player = {
      x: 25,
      y: canvas.height / 2 - paddleHeight / 2,
      score: 0
    };

    const computer = {
      x: canvas.width - 25 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      score: 0,
      speed: 4.6
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 9,
      speed: 6,
      velocityX: 6,
      velocityY: 3
    };

    const keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function keepPaddleInside(p) {
      p.y = clamp(p.y, 0, canvas.height - paddleHeight);
    }

    function movePlayerToY(y) {
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      const localY = (y - rect.top) * scaleY;
      player.y = localY - paddleHeight / 2;
      keepPaddleInside(player);
    }

    // Mouse move
    canvas.addEventListener("mousemove", (e) => {
      movePlayerToY(e.clientY);
    });

    // Touch move
    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (e.touches[0]) movePlayerToY(e.touches[0].clientY);
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      if (e.touches[0]) movePlayerToY(e.touches[0].clientY);
    }, { passive: false });

    // Keyboard
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp") keys.ArrowUp = true;
      if (e.key === "ArrowDown") keys.ArrowDown = true;
    });

    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowUp") keys.ArrowUp = false;
      if (e.key === "ArrowDown") keys.ArrowDown = false;
    });

    function resetBall(direction) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      const angle = (Math.random() * 1.2) - 0.6;
      ball.velocityX = direction * ball.speed;
      ball.velocityY = ball.speed * angle;
    }

    function rectCircleCollision(rectX, rectY, rectW, rectH, circleX, circleY, radius) {
      const closestX = clamp(circleX, rectX, rectX + rectW);
      const closestY = clamp(circleY, rectY, rectY + rectH);
      const dx = circleX - closestX;
      const dy = circleY - closestY;
      return (dx * dx + dy * dy) < (radius * radius);
    }

    function update() {
      // Player keyboard movement
      if (keys.ArrowUp) player.y -= paddleSpeed;
      if (keys.ArrowDown) player.y += paddleSpeed;
      keepPaddleInside(player);

      // Computer AI
      const center = computer.y + paddleHeight / 2;
      if (center < ball.y - 10) {
        computer.y += computer.speed;
      } else if (center > ball.y + 10) {
        computer.y -= computer.speed;
      }
      keepPaddleInside(computer);

      // Ball movement
      ball.x += ball.velocityX;
      ball.y += ball.velocityY;

      // Top/bottom wall collision
      if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
        ball.velocityY *= -1;
        ball.y = clamp(ball.y, ball.radius, canvas.height - ball.radius);
      }

      // Player paddle collision
      if (
        ball.velocityX < 0 &&
        rectCircleCollision(player.x, player.y, paddleWidth, paddleHeight, ball.x, ball.y, ball.radius)
      ) {
        ball.x = player.x + paddleWidth + ball.radius;
        ball.velocityX = Math.abs(ball.velocityX) + 0.25;

        const hitPos = (ball.y - (player.y + paddleHeight / 2)) / (paddleHeight / 2);
        ball.velocityY = hitPos * ball.speed;
      }

      // Computer paddle collision
      if (
        ball.velocityX > 0 &&
        rectCircleCollision(computer.x, computer.y, paddleWidth, paddleHeight, ball.x, ball.y, ball.radius)
      ) {
        ball.x = computer.x - ball.radius;
        ball.velocityX = -Math.abs(ball.velocityX) - 0.25;

        const hitPos = (ball.y - (computer.y + paddleHeight / 2)) / (paddleHeight / 2);
        ball.velocityY = hitPos * ball.speed;
      }

      // Score
      if (ball.x + ball.radius < 0) {
        computer.score++;
        computerScoreEl.textContent = computer.score;
        resetBall(1);
      }

      if (ball.x - ball.radius > canvas.width) {
        player.score++;
        playerScoreEl.textContent = player.score;
        resetBall(-1);
      }
    }

    function drawNet() {
      ctx.setLineDash([12, 14]);
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawPaddle(x, y) {
      ctx.fillStyle = "#fff";
      ctx.fillRect(x, y, paddleWidth, paddleHeight);
    }

    function drawBall() {
      ctx.fillStyle = "#00bfff";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawNet();
      drawPaddle(player.x, player.y);
      drawPaddle(computer.x, computer.y);
      drawBall();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    resetBall(1);
    loop();
  </script>
</body>
</html>
